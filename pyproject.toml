[project]
name = "ai-customer-support-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rishabh Suratiya", email = "rishabhsuratiya@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.163.2",
    "httpx>=0.28.1",
    "langchain>=1.5.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.2",
    "langchain-groq>=1.2.0",
    "langchain-huggingface>=1.3.0",
    "langgraph>=1.2.22",
    "pydantic>=2.14.3",
    "pypdf>=7.1.0",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "requests>=2.34.2",
    "sentence-transformers>=6.3.0",
    "sqlalchemy>=2.1.9",
    "streamlit>=1.67.0",
    "transformers>=5.23.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ai-customer-support-assistant = "ai_customer_support_assistant:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
